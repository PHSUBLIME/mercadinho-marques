<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mercearia Marques - Controle de Validades</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leitor de Câmera -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; -webkit-tap-highlight-color: transparent; }
        #reader video { width: 100% !important; border-radius: 1rem; object-fit: cover; }
    </style>
</head>
<body class="bg-zinc-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- CABEÇALHO FIXO -->
    <header class="bg-zinc-900 border-b border-zinc-800 p-4 sticky top-0 z-40 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 bg-emerald-500/20 text-emerald-400 rounded-xl flex items-center justify-center text-lg">
                <i class="fa-solid fa-basket-shopping"></i>
            </div>
            <div>
                <h1 class="text-sm font-black text-emerald-400 leading-tight tracking-wide">MERCEARIA MARQUES</h1>
                <span class="text-[10px] text-zinc-400 font-semibold block">Controle Anti-Vencimento</span>
            </div>
        </div>

        <button onclick="carregarDados()" class="bg-zinc-800 active:bg-zinc-700 text-zinc-300 w-9 h-9 rounded-xl flex items-center justify-center text-xs border border-zinc-700">
            <i class="fa-solid fa-rotate text-emerald-400" id="icon-sync"></i>
        </button>
    </header>

    <!-- CONTEÚDO PRINCIPAL (COM ROLAGEM) -->
    <main class="flex-1 p-4 pb-28 max-w-lg mx-auto w-full space-y-4">

        <!-- ================= SEÇÃO 1: FAROL DE VALIDADES ================= -->
        <section id="secao-farol" class="secao-conteudo space-y-4">
            
            <!-- CARDS DE RESUMO KPI -->
            <div class="grid grid-cols-2 gap-2.5">
                <div class="bg-rose-950/40 border border-rose-800/60 p-3.5 rounded-2xl">
                    <span class="text-[10px] font-black uppercase text-rose-400 tracking-wider block">Crítico (&le; 7 Dias)</span>
                    <strong class="text-2xl font-black text-rose-400 mt-0.5 block" id="kpi-critico">0</strong>
                    <span class="text-[10px] text-rose-300 font-medium">Urgente em risco</span>
                </div>

                <div class="bg-amber-950/40 border border-amber-800/60 p-3.5 rounded-2xl">
                    <span class="text-[10px] font-black uppercase text-amber-400 tracking-wider block">Atenção (&le; 30 Dias)</span>
                    <strong class="text-2xl font-black text-amber-400 mt-0.5 block" id="kpi-atencao">0</strong>
                    <span class="text-[10px] text-amber-300 font-medium">Oferecer desconto</span>
                </div>
            </div>

            <!-- BOTÃO DIVULGAR OFERTAS WHATSAPP -->
            <button onclick="divulgarOfertasWhatsApp()" class="w-full bg-emerald-600 active:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-emerald-950/40 border border-emerald-500/30">
                <i class="fa-brands fa-whatsapp text-base"></i> Gerar Ofertas de Liquidação no Whats
            </button>

            <!-- FILTROS DE RISCO (PILLS TÁTEIS) -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
                <button onclick="filtrarFarol('todos')" id="btn-f-todos" class="px-3 py-2 rounded-xl font-bold bg-emerald-500 text-zinc-950 shrink-0">Todos</button>
                <button onclick="filtrarFarol('critico')" id="btn-f-critico" class="px-3 py-2 rounded-xl font-bold bg-zinc-900 text-rose-400 border border-zinc-800 shrink-0">🔴 Crítico (&le;7d)</button>
                <button onclick="filtrarFarol('atencao')" id="btn-f-atencao" class="px-3 py-2 rounded-xl font-bold bg-zinc-900 text-amber-400 border border-zinc-800 shrink-0">🟡 Atenção (&le;30d)</button>
                <button onclick="filtrarFarol('ok')" id="btn-f-ok" class="px-3 py-2 rounded-xl font-bold bg-zinc-900 text-emerald-400 border border-zinc-800 shrink-0">🟢 OK (&gt;30d)</button>
                <button onclick="filtrarFarol('vencido')" id="btn-f-vencido" class="px-3 py-2 rounded-xl font-bold bg-zinc-900 text-purple-400 border border-zinc-800 shrink-0">⬛ Vencidos</button>
            </div>

            <!-- CAMPO DE BUSCA -->
            <div class="bg-zinc-900 px-3.5 py-2.5 rounded-xl border border-zinc-800 flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass text-emerald-400 text-sm"></i>
                <input type="text" id="busca-farol" onkeyup="renderizarFarol()" placeholder="Buscar produto, lote, EAN..." class="bg-transparent text-white text-xs w-full focus:outline-none">
            </div>

            <!-- LISTA DE CARDS DE LOTES (MOBILE FIRST) -->
            <div id="lista-farol-cards" class="space-y-3"></div>
        </section>

        <!-- ================= SEÇÃO 2: BIPAR / ENTRADA DE LOTE ================= -->
        <section id="secao-bipar" class="secao-conteudo hidden space-y-4">
            <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 space-y-4 shadow-xl">
                <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                    <h2 class="text-base font-black text-amber-400 flex items-center gap-2">
                        <i class="fa-solid fa-box-archive"></i> Nova Entrada de Lote
                    </h2>
                    <span class="text-[10px] bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded font-bold">Validade</span>
                </div>

                <form onsubmit="salvarLoteForm(event)" class="space-y-3 text-xs">
                    <div>
                        <label class="block text-zinc-400 font-bold mb-1">Buscar ou Bipar Produto</label>
                        <div class="flex gap-2">
                            <input type="text" id="lote-prod-busca" list="dl-produtos-lote" onchange="selecionarProdutoFormLote(this.value)" placeholder="Digite nome ou EAN..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-400 text-xs">
                            <datalist id="dl-produtos-lote"></datalist>
                            <button type="button" onclick="abrirCameraScanner('lote')" class="bg-amber-500 active:bg-amber-400 text-zinc-950 font-black px-4 py-3 rounded-xl transition-all shrink-0 flex items-center gap-1 text-xs">
                                <i class="fa-solid fa-camera"></i> 📷
                            </button>
                        </div>
                        <input type="hidden" id="lote-prod-id">
                    </div>

                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="block text-zinc-400 font-semibold mb-1">Nº do Lote</label>
                            <input type="text" id="lote-num" placeholder="Ex: LT-01" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white font-mono focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-amber-400 font-black uppercase mb-1">Validade *</label>
                            <input type="date" id="lote-val" required class="w-full bg-zinc-800 border border-amber-500/60 rounded-xl p-3 text-white font-bold focus:outline-none focus:border-amber-400">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="block text-zinc-400 font-semibold mb-1">Quantidade *</label>
                            <input type="number" id="lote-qtd" required min="1" value="1" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white font-bold focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-zinc-400 font-semibold mb-1">Localização</label>
                            <input type="text" id="lote-local" placeholder="Ex: Gôndola A" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white focus:outline-none">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-amber-400 active:bg-amber-300 text-zinc-950 font-black py-3.5 rounded-xl text-sm transition-all shadow-lg shadow-amber-950/30">
                        REGISTRAR LOTE NO SISTEMA
                    </button>
                </form>
            </div>
        </section>

        <!-- ================= SEÇÃO 3: CATÁLOGO DE PRODUTOS ================= -->
        <section id="secao-produtos" class="secao-conteudo hidden space-y-4">
            <div class="flex justify-between items-center bg-zinc-900 p-4 rounded-2xl border border-zinc-800">
                <div>
                    <h2 class="text-base font-black text-emerald-400">Catálogo de Produtos</h2>
                    <span class="text-[10px] text-zinc-400">Itens cadastrados</span>
                </div>
                <button onclick="abrirModalProduto()" class="bg-emerald-500 active:bg-emerald-400 text-zinc-950 font-bold px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5">
                    <i class="fa-solid fa-plus"></i> Novo
                </button>
            </div>

            <!-- CAMPO DE BUSCA PRODUTOS -->
            <div class="bg-zinc-900 px-3.5 py-2.5 rounded-xl border border-zinc-800 flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass text-emerald-400 text-sm"></i>
                <input type="text" id="busca-produtos" onkeyup="renderizarProdutos()" placeholder="Buscar nome ou EAN..." class="bg-transparent text-white text-xs w-full focus:outline-none">
            </div>

            <div id="lista-produtos-cards" class="space-y-3"></div>
        </section>

        <!-- ================= SEÇÃO 4: REGISTRO DE PERDAS ================= -->
        <section id="secao-perdas" class="secao-conteudo hidden space-y-4">
            <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 flex justify-between items-center">
                <div>
                    <span class="text-[10px] font-bold text-zinc-400 uppercase block">Prejuízo por Vencimentos</span>
                    <strong class="text-2xl font-black text-rose-400" id="perdas-total-txt">R$ 0,00</strong>
                </div>
                <button onclick="abrirModalPerda()" class="bg-rose-600 active:bg-rose-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs shadow-lg shadow-rose-950/40">
                    <i class="fa-solid fa-dumpster"></i> Baixa Perda
                </button>
            </div>

            <div id="lista-perdas-cards" class="space-y-3"></div>
        </section>

    </main>

    <!-- BARRA DE NAVEGAÇÃO INFERIOR FIXA (MOBILE BOTTOM NAV) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-zinc-900/95 backdrop-blur-md border-t border-zinc-800 flex justify-around items-center py-2.5 z-50 px-2">
        <button onclick="navegar('farol')" id="nav-farol" class="nav-item active flex flex-col items-center gap-1 text-emerald-400 font-bold transition-all">
            <i class="fa-solid fa-traffic-light text-lg"></i>
            <span class="text-[10px]">Farol</span>
        </button>

        <button onclick="navegar('bipar')" id="nav-bipar" class="nav-item flex flex-col items-center gap-1 text-zinc-400 font-medium transition-all">
            <div class="w-10 h-10 bg-amber-500 text-zinc-950 rounded-full flex items-center justify-center text-lg font-black shadow-lg shadow-amber-950/50 -mt-5 border-2 border-zinc-950">
                <i class="fa-solid fa-plus"></i>
            </div>
            <span class="text-[10px]">Bipar Lote</span>
        </button>

        <button onclick="navegar('produtos')" id="nav-produtos" class="nav-item flex flex-col items-center gap-1 text-zinc-400 font-medium transition-all">
            <i class="fa-solid fa-boxes-stacked text-lg"></i>
            <span class="text-[10px]">Produtos</span>
        </button>

        <button onclick="navegar('perdas')" id="nav-perdas" class="nav-item flex flex-col items-center gap-1 text-zinc-400 font-medium transition-all">
            <i class="fa-solid fa-dumpster text-lg"></i>
            <span class="text-[10px]">Perdas</span>
        </button>
    </nav>

    <!-- ================= MODAIS ================= -->

    <!-- MODAL LEITOR CÂMERA -->
    <div id="modal-camera" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[1000] hidden flex flex-col items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-sm w-full p-5 space-y-3 text-center shadow-2xl relative">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="text-sm font-black text-amber-400 flex items-center gap-1.5"><i class="fa-solid fa-camera"></i> Leitor de Código</h3>
                <button onclick="fecharCameraScanner()" class="text-zinc-400 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="reader" class="w-full bg-black rounded-2xl overflow-hidden border border-amber-500/40 min-h-[220px]"></div>
            <button onclick="fecharCameraScanner()" class="w-full bg-zinc-800 text-zinc-300 font-bold py-2.5 rounded-xl text-xs border border-zinc-700">Fechar Câmera</button>
        </div>
    </div>

    <!-- MODAL CADASTRO PRODUTO -->
    <div id="modal-produto" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-sm w-full p-5 space-y-3 shadow-2xl">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="text-sm font-black text-emerald-400" id="prod-modal-titulo">Novo Produto</h3>
                <button onclick="fecharModalProduto()" class="text-zinc-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="salvarProdutoForm(event)" class="space-y-2.5 text-xs">
                <input type="hidden" id="f-prod-id">
                <div>
                    <label class="block text-zinc-400 font-semibold mb-1">EAN (Código de Barras)</label>
                    <div class="flex gap-2">
                        <input type="text" id="f-prod-ean" placeholder="789..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-white font-mono focus:outline-none">
                        <button type="button" onclick="abrirCameraScanner('prod')" class="bg-amber-500 text-zinc-950 font-bold px-3 py-2.5 rounded-xl">📷</button>
                    </div>
                </div>
                <div>
                    <label class="block text-zinc-400 font-semibold mb-1">Nome do Produto *</label>
                    <input type="text" id="f-prod-nome" required placeholder="Ex: Leite Integral Parmalat 1L" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-white focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-zinc-400 font-semibold mb-1">Categoria</label>
                        <select id="f-prod-cat" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-white focus:outline-none">
                            <option value="Mercearia">Mercearia</option>
                            <option value="Laticínios">Laticínios</option>
                            <option value="Bebidas">Bebidas</option>
                            <option value="Padaria">Padaria</option>
                            <option value="Limpeza">Limpeza</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-zinc-400 font-semibold mb-1">Unidade</label>
                        <select id="f-prod-uni" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-white focus:outline-none">
                            <option value="Un">Unidade (Un)</option>
                            <option value="Kg">Quilo (Kg)</option>
                            <option value="L">Litro (L)</option>
                            <option value="Cx">Caixa (Cx)</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-zinc-400 font-semibold mb-1">Preço Custo (R$)</label>
                        <input type="number" step="0.01" id="f-prod-custo" placeholder="0.00" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-rose-300 font-bold focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-emerald-400 font-semibold mb-1">Preço Venda (R$)</label>
                        <input type="number" step="0.01" id="f-prod-venda" placeholder="0.00" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-emerald-400 font-bold focus:outline-none">
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-zinc-800">
                    <button type="button" onclick="fecharModalProduto()" class="px-3 py-2 bg-zinc-800 text-zinc-300 rounded-xl">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-500 text-zinc-950 font-bold rounded-xl">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL BAIXA DE PERDA -->
    <div id="modal-perda" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-sm w-full p-5 space-y-3 shadow-2xl">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="text-sm font-black text-rose-400 flex items-center gap-1.5"><i class="fa-solid fa-dumpster"></i> Registrar Descarte</h3>
                <button onclick="fecharModalPerda()" class="text-zinc-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="salvarPerdaForm(event)" class="space-y-2.5 text-xs">
                <div>
                    <label class="block text-rose-400 font-bold mb-1">Lote Avariado / Vencido</label>
                    <input type="text" id="f-perda-lote-busca" list="dl-perdas-lotes" onchange="selecionarLotePerdaForm(this.value)" placeholder="Buscar lote..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-white focus:outline-none">
                    <datalist id="dl-perdas-lotes"></datalist>
                    <input type="hidden" id="f-perda-lote-id">
                </div>
                <div>
                    <label class="block text-zinc-400 font-semibold mb-1">Quantidade Descartada *</label>
                    <input type="number" id="f-perda-qtd" required min="1" value="1" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-white font-bold focus:outline-none">
                </div>
                <div>
                    <label class="block text-zinc-400 font-semibold mb-1">Motivo</label>
                    <select id="f-perda-motivo" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-white focus:outline-none">
                        <option value="Vencimento">Vencimento Expirado</option>
                        <option value="Avaria / Estragado">Embalagem Avariada</option>
                        <option value="Consumo Interno">Consumo Interno</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-zinc-800">
                    <button type="button" onclick="fecharModalPerda()" class="px-3 py-2 bg-zinc-800 text-zinc-300 rounded-xl">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-rose-600 text-white font-bold rounded-xl">Confirmar Perda</button>
                </div>
            </form>
        </div>
    </div>

    <!-- TOAST NOTIFICAÇÃO -->
    <div id="toast" class="fixed top-5 left-4 right-4 bg-zinc-900 text-white border border-emerald-400 px-4 py-3 rounded-2xl shadow-2xl transform -translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 z-[2000] max-w-sm mx-auto">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toast-msg" class="font-medium text-xs">Ação realizada!</span>
    </div>

    <!-- SCRIPT JS LÓGICA E SUPABASE -->
    <script>
        // CONFIGURAÇÃO SUPABASE PREENCHIDA
        const SUPABASE_URL = 'https://ssgbhzsjbvioyeuwvhez.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_e_hKXIyJfFTDzFaD-MEDYg_ez8ec68N';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let appData = {
            produtos: [],
            lotes: [],
            perdas: [],
            filtroFarol: 'todos'
        };

        let html5QrCode = null;
        let destinoScanner = null;

        // CARREGAR DADOS DO SUPABASE
        async function carregarDados() {
            const iconSync = document.getElementById('icon-sync');
            if (iconSync) iconSync.classList.add('fa-spin');

            try {
                const [resProd, resLote, resPerd] = await Promise.all([
                    supabaseClient.from('mercearia_produtos').select('*').order('nome'),
                    supabaseClient.from('mercearia_lotes').select('*').order('validade'),
                    supabaseClient.from('mercearia_perdas').select('*').order('id', { ascending: false })
                ]);

                if (resProd.data) appData.produtos = resProd.data;
                if (resLote.data) appData.lotes = resLote.data;
                if (resPerd.data) appData.perdas = resPerd.data;

                atualizarInterface();
            } catch (e) {
                console.error("Erro ao carregar dados do Supabase:", e);
                mostrarToast("Erro ao conectar com o banco!", "erro");
            } finally {
                if (iconSync) iconSync.classList.remove('fa-spin');
            }
        }

        function atualizarInterface() {
            renderizarFarol();
            renderizarProdutos();
            renderizarPerdas();
            popularDatalists();
        }

        function navegar(secao) {
            document.querySelectorAll('.secao-conteudo').forEach(el => el.classList.add('hidden'));
            const alvo = document.getElementById(`secao-${secao}`);
            if (alvo) alvo.classList.remove('hidden');

            document.querySelectorAll('.nav-item').forEach(b => {
                b.classList.remove('text-emerald-400', 'font-bold');
                b.classList.add('text-zinc-400', 'font-medium');
            });

            const btn = document.getElementById(`nav-${secao}`);
            if (btn) {
                btn.classList.remove('text-zinc-400', 'font-medium');
                btn.classList.add('text-emerald-400', 'font-bold');
            }
        }

        // ================= FAROL DE VALIDADE (CARDS MOBILE) =================
        function renderizarFarol() {
            const container = document.getElementById('lista-farol-cards');
            if (!container) return;
            container.innerHTML = '';

            const busca = (document.getElementById('busca-farol')?.value || '').toLowerCase();
            
            const hojeDate = new Date();
            hojeDate.setHours(0,0,0,0);

            let lotesValidos = appData.lotes.filter(l => parseFloat(l.quantidade || 0) > 0);

            let cCritico = 0;
            let cAtencao = 0;

            if (lotesValidos.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-zinc-500 text-xs italic bg-zinc-900 rounded-2xl border border-zinc-800">Nenhum lote com quantidade disponível. Vazio!</div>`;
                document.getElementById('kpi-critico').innerText = '0';
                document.getElementById('kpi-atencao').innerText = '0';
                return;
            }

            lotesValidos.forEach(lote => {
                const prod = appData.produtos.find(p => p.id == lote.produto_id);
                const nomeProd = prod ? prod.nome : 'Produto Desconhecido';
                const eanProd = prod ? (prod.ean || '-') : '-';

                const valParts = lote.validade.split('-');
                const valDate = new Date(valParts[0], valParts[1] - 1, valParts[2]);
                const diffDias = Math.ceil((valDate - hojeDate) / (1000 * 60 * 60 * 24));

                let statusChave = 'ok';
                let tagBadge = '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded text-[10px] font-bold">🟢 OK</span>';
                let borderCor = 'border-zinc-800';

                if (diffDias <= 0) {
                    statusChave = 'vencido';
                    tagBadge = '<span class="bg-purple-950 text-purple-300 border border-purple-800 px-2 py-0.5 rounded text-[10px] font-black">⬛ VENCIDO</span>';
                    borderCor = 'border-purple-800/80 bg-purple-950/20';
                } else if (diffDias <= 7) {
                    statusChave = 'critico';
                    cCritico++;
                    tagBadge = '<span class="bg-rose-500/20 text-rose-400 border border-rose-500/40 px-2 py-0.5 rounded text-[10px] font-black animate-pulse">🔴 CRÍTICO</span>';
                    borderCor = 'border-rose-800/80 bg-rose-950/20';
                } else if (diffDias <= 30) {
                    statusChave = 'atencao';
                    cAtencao++;
                    tagBadge = '<span class="bg-amber-500/20 text-amber-400 border border-amber-500/40 px-2 py-0.5 rounded text-[10px] font-bold">🟡 ATENÇÃO</span>';
                    borderCor = 'border-amber-800/80 bg-amber-950/20';
                }

                if (appData.filtroFarol !== 'todos' && statusChave !== appData.filtroFarol) return;

                const buscaTexto = `${nomeProd} ${eanProd} ${lote.numero_lote}`.toLowerCase();
                if (busca && !buscaTexto.includes(busca)) return;

                const valFormatada = `${valParts[2]}/${valParts[1]}/${valParts[0]}`;

                const card = document.createElement('div');
                card.className = `bg-zinc-900 border ${borderCor} p-4 rounded-2xl space-y-2.5 shadow-md`;
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="pr-2">
                            <strong class="text-white text-sm block leading-snug">${escapeAttr(nomeProd)}</strong>
                            <span class="text-[10px] font-mono text-zinc-400"><i class="fa-solid fa-barcode"></i> ${escapeAttr(eanProd)}</span>
                        </div>
                        ${tagBadge}
                    </div>

                    <div class="flex justify-between items-center text-xs bg-zinc-950/60 p-2.5 rounded-xl border border-zinc-800/80">
                        <div>
                            <span class="text-[10px] text-zinc-500 block uppercase font-bold">Validade</span>
                            <strong class="text-white text-xs">${valFormatada}</strong>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-zinc-500 block uppercase font-bold">Prazo</span>
                            <strong class="${diffDias <= 7 ? 'text-rose-400 font-black' : (diffDias <= 30 ? 'text-amber-400 font-bold' : 'text-emerald-400')}">
                                ${diffDias <= 0 ? 'EXPIRADO' : `${diffDias} dias`}
                            </strong>
                        </div>
                    </div>

                    <div class="flex justify-between items-center text-xs pt-0.5">
                        <span class="text-zinc-400">Qtd: <strong class="text-white font-bold">${lote.quantidade} ${prod ? prod.unidade : 'Un'}</strong></span>
                        <div class="flex gap-2">
                            <button onclick="abrirModalPerdaComLote(${lote.id})" class="bg-rose-950/60 active:bg-rose-900 text-rose-400 px-3 py-1.5 rounded-xl text-xs font-bold border border-rose-800/50">
                                <i class="fa-solid fa-trash"></i> Descartar
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('kpi-critico').innerText = cCritico;
            document.getElementById('kpi-atencao').innerText = cAtencao;
        }

        function filtrarFarol(tipo) {
            appData.filtroFarol = tipo;
            document.querySelectorAll('#secao-farol button[id^="btn-f-"]').forEach(b => {
                b.className = "px-3 py-2 rounded-xl font-bold bg-zinc-900 text-zinc-400 border border-zinc-800 shrink-0";
            });
            const btn = document.getElementById(`btn-f-${tipo}`);
            if (btn) btn.className = "px-3 py-2 rounded-xl font-bold bg-emerald-500 text-zinc-950 shrink-0";
            renderizarFarol();
        }

        function divulgarOfertasWhatsApp() {
            const hojeDate = new Date();
            hojeDate.setHours(0,0,0,0);

            const lotesAtençao = appData.lotes.filter(l => {
                if (parseFloat(l.quantidade || 0) <= 0) return false;
                const valParts = l.validade.split('-');
                const valDate = new Date(valParts[0], valParts[1] - 1, valParts[2]);
                const diffDias = Math.ceil((valDate - hojeDate) / (1000 * 60 * 60 * 24));
                return diffDias > 0 && diffDias <= 30;
            });

            if (lotesAtençao.length === 0) {
                mostrarToast("Nenhum item vencendo nos próximos 30 dias!", "alerta");
                return;
            }

            let msg = `🛒 *OFERTAS DE LIQUIDAÇÃO - MERCADINHO MARQUES* 🏷️✨\n\n` +
                      `Aproveite nossos descontos especiais de liquidação:\n\n`;

            lotesAtençao.forEach(l => {
                const prod = appData.produtos.find(p => p.id == l.produto_id);
                if (prod) {
                    const precoOrig = parseFloat(prod.preco_venda || 0);
                    const precoPromo = precoOrig * 0.70; // 30% OFF
                    msg += `• *${prod.nome}*: De ~R$ ${precoOrig.toFixed(2)}~ por *R$ ${precoPromo.toFixed(2)}* 🔥\n`;
                }
            });

            msg += `\n📍 *Mercadinho Marques* - Venha garantir o seu antes que acabe!`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // ================= CADASTRO DE LOTE =================
        function popularDatalists() {
            const dlLote = document.getElementById('dl-produtos-lote');
            if (dlLote) {
                dlLote.innerHTML = '';
                appData.produtos.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = `${p.nome} ${p.ean ? `[EAN:${p.ean}]` : ''} [ID:${p.id}]`;
                    dlLote.appendChild(opt);
                });
            }

            const dlPerda = document.getElementById('dl-perdas-lotes');
            if (dlPerda) {
                dlPerda.innerHTML = '';
                appData.lotes.filter(l => parseFloat(l.quantidade || 0) > 0).forEach(l => {
                    const prod = appData.produtos.find(p => p.id == l.produto_id);
                    const opt = document.createElement('option');
                    opt.value = `${prod ? prod.nome : 'Produto'} [Val:${l.validade}] [Qtd:${l.quantidade}] [ID:${l.id}]`;
                    dlPerda.appendChild(opt);
                });
            }
        }

        function selecionarProdutoFormLote(val) {
            if (!val) return;
            const matchId = val.match(/\[ID:(\d+)\]/);
            if (matchId && matchId[1]) {
                document.getElementById('lote-prod-id').value = matchId[1];
            } else {
                const prod = appData.produtos.find(p => p.nome.toLowerCase() === val.toLowerCase() || p.ean === val);
                if (prod) document.getElementById('lote-prod-id').value = prod.id;
            }
        }

        async function salvarLoteForm(e) {
            e.preventDefault();
            let prodId = document.getElementById('lote-prod-id').value;
            const prodInput = document.getElementById('lote-prod-busca').value;

            if (!prodId && prodInput) {
                selecionarProdutoFormLote(prodInput);
                prodId = document.getElementById('lote-prod-id').value;
            }

            if (!prodId) {
                mostrarToast("Selecione um produto do catálogo!", "erro");
                return;
            }

            const loteData = {
                produto_id: parseInt(prodId),
                numero_lote: document.getElementById('lote-num').value.trim() || 'LT-01',
                validade: document.getElementById('lote-val').value,
                quantidade: parseFloat(document.getElementById('lote-qtd').value || 1),
                localizacao: document.getElementById('lote-local').value.trim() || 'Gôndola'
            };

            const { error } = await supabaseClient.from('mercearia_lotes').insert([loteData]);

            if (!error) {
                mostrarToast("Novo lote cadastrado!");
                document.getElementById('lote-prod-busca').value = '';
                document.getElementById('lote-prod-id').value = '';
                document.getElementById('lote-num').value = '';
                document.getElementById('lote-val').value = '';
                await carregarDados();
                navegar('farol');
            } else {
                mostrarToast(`Erro ao salvar lote: ${error.message}`, "erro");
            }
        }

        // ================= CATÁLOGO DE PRODUTOS =================
        function renderizarProdutos() {
            const container = document.getElementById('lista-produtos-cards');
            if (!container) return;
            container.innerHTML = '';

            const busca = (document.getElementById('busca-produtos')?.value || '').toLowerCase();

            if (appData.produtos.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-zinc-500 text-xs italic bg-zinc-900 rounded-2xl border border-zinc-800">Nenhum produto cadastrado. Clique em "+ Novo".</div>`;
                return;
            }

            appData.produtos.forEach(p => {
                const buscaTexto = `${p.nome} ${p.ean} ${p.categoria}`.toLowerCase();
                if (busca && !buscaTexto.includes(busca)) return;

                const lotesProd = appData.lotes.filter(l => l.produto_id == p.id && parseFloat(l.quantidade || 0) > 0);
                const totalQtd = lotesProd.reduce((acc, l) => acc + parseFloat(l.quantidade || 0), 0);

                const card = document.createElement('div');
                card.className = "bg-zinc-900 border border-zinc-800 p-4 rounded-2xl space-y-2";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <strong class="text-white text-sm block">${escapeAttr(p.nome)}</strong>
                            <span class="text-[10px] text-zinc-500 font-mono"><i class="fa-solid fa-barcode"></i> ${escapeAttr(p.ean || 'Sem EAN')}</span>
                        </div>
                        <span class="bg-zinc-800 text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded border border-zinc-700">${escapeAttr(p.categoria || 'Mercearia')}</span>
                    </div>

                    <div class="flex justify-between items-center text-xs pt-1">
                        <div>
                            <span class="text-[10px] text-zinc-500 block font-bold">Estoque Total</span>
                            <strong class="text-white font-bold">${totalQtd} ${escapeAttr(p.unidade || 'Un')}</strong>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-zinc-500 block font-bold">Preço Venda</span>
                            <strong class="text-emerald-400 font-bold">R$ ${parseFloat(p.preco_venda || 0).toFixed(2)}</strong>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function abrirModalProduto() {
            document.getElementById('f-prod-id').value = '';
            document.getElementById('f-prod-ean').value = '';
            document.getElementById('f-prod-nome').value = '';
            document.getElementById('f-prod-custo').value = '';
            document.getElementById('f-prod-venda').value = '';
            document.getElementById('modal-produto').classList.remove('hidden');
        }

        function fecharModalProduto() { document.getElementById('modal-produto').classList.add('hidden'); }

        async function salvarProdutoForm(e) {
            e.preventDefault();
            const nome = document.getElementById('f-prod-nome').value.trim();
            if (!nome) return;

            const pData = {
                ean: document.getElementById('f-prod-ean').value.trim(),
                nome: nome,
                categoria: document.getElementById('f-prod-cat').value,
                unidade: document.getElementById('f-prod-uni').value,
                preco_custo: parseFloat(document.getElementById('f-prod-custo').value || 0),
                preco_venda: parseFloat(document.getElementById('f-prod-venda').value || 0)
            };

            const { error } = await supabaseClient.from('mercearia_produtos').insert([pData]);

            if (!error) {
                mostrarToast("Produto cadastrado com sucesso!");
                fecharModalProduto();
                await carregarDados();
            } else {
                mostrarToast(`Erro: ${error.message}`, "erro");
            }
        }

        // ================= REGISTRO DE PERDAS =================
        function renderizarPerdas() {
            const container = document.getElementById('lista-perdas-cards');
            if (!container) return;
            container.innerHTML = '';

            let totalPrejuizio = 0;

            if (appData.perdas.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-zinc-500 text-xs italic bg-zinc-900 rounded-2xl border border-zinc-800">Nenhum registro de descarte efetuado.</div>`;
                document.getElementById('perdas-total-txt').innerText = 'R$ 0,00';
                return;
            }

            appData.perdas.forEach(p => {
                totalPrejuizio += parseFloat(p.prejuizo_total || 0);

                const card = document.createElement('div');
                card.className = "bg-zinc-900 border border-rose-950/60 p-3.5 rounded-2xl space-y-1.5";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <strong class="text-white text-xs">${escapeAttr(p.produto_nome)}</strong>
                        <span class="text-rose-400 font-black text-xs">R$ ${parseFloat(p.prejuizo_total||0).toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between items-center text-[11px] text-zinc-400">
                        <span>Descarte: ${p.quantidade} un. (${escapeAttr(p.motivo)})</span>
                        <span class="text-zinc-500">${p.data_descarte}</span>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('perdas-total-txt').innerText = `R$ ${totalPrejuizio.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        }

        function abrirModalPerda() {
            document.getElementById('f-perda-lote-id').value = '';
            document.getElementById('f-perda-lote-busca').value = '';
            document.getElementById('modal-perda').classList.remove('hidden');
        }

        function abrirModalPerdaComLote(loteId) {
            abrirModalPerda();
            const lote = appData.lotes.find(l => l.id == loteId);
            if (lote) {
                const prod = appData.produtos.find(p => p.id == lote.produto_id);
                document.getElementById('f-perda-lote-id').value = lote.id;
                document.getElementById('f-perda-lote-busca').value = `${prod ? prod.nome : 'Prod'} [Val:${lote.validade}] [Qtd:${lote.quantidade}] [ID:${lote.id}]`;
            }
        }

        function fecharModalPerda() { document.getElementById('modal-perda').classList.add('hidden'); }

        function selecionarLotePerdaForm(val) {
            if (!val) return;
            const matchId = val.match(/\[ID:(\d+)\]/);
            if (matchId && matchId[1]) {
                document.getElementById('f-perda-lote-id').value = matchId[1];
            }
        }

        async function salvarPerdaForm(e) {
            e.preventDefault();
            const loteId = document.getElementById('f-perda-lote-id').value;
            const qtdDescarte = parseFloat(document.getElementById('f-perda-qtd').value || 1);
            const motivo = document.getElementById('f-perda-motivo').value;

            const lote = appData.lotes.find(l => l.id == loteId);
            if (!lote) {
                mostrarToast("Selecione um lote válido!", "erro");
                return;
            }

            const prod = appData.produtos.find(p => p.id == lote.produto_id);
            const custoUnit = prod ? parseFloat(prod.preco_custo || 0) : 0;
            const prejuizio = qtdDescarte * custoUnit;

            // 1. Abate a quantidade no Lote
            const novaQtd = Math.max(0, parseFloat(lote.quantidade || 0) - qtdDescarte);
            await supabaseClient.from('mercearia_lotes').update({ quantidade: novaQtd }).eq('id', lote.id);

            // 2. Insere registro de Perda
            const perdaData = {
                lote_id: lote.id,
                produto_nome: prod ? prod.nome : 'Produto',
                quantidade: qtdDescarte,
                prejuizo_total: prejuizio,
                motivo: motivo,
                data_descarte: new Date().toISOString().split('T')[0]
            };

            const { error } = await supabaseClient.from('mercearia_perdas').insert([perdaData]);

            if (!error) {
                fecharModalPerda();
                mostrarToast(`Descarte registrado! Prejuízo: R$ ${prejuizio.toFixed(2)}`);
                await carregarDados();
            } else {
                mostrarToast(`Erro: ${error.message}`, "erro");
            }
        }

        // ================= CÂMERA SCANNER =================
        function abrirCameraScanner(destino) {
            destinoScanner = destino;
            document.getElementById('modal-camera').classList.remove('hidden');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 220, height: 140 } },
                (codigoLido) => {
                    fecharCameraScanner();
                    if (destinoScanner === 'prod') {
                        document.getElementById('f-prod-ean').value = codigoLido;
                    } else if (destinoScanner === 'lote') {
                        document.getElementById('lote-prod-busca').value = codigoLido;
                        selecionarProdutoFormLote(codigoLido);
                    }
                    mostrarToast(`EAN Lido: ${codigoLido}`);
                },
                () => {}
            ).catch(err => {
                mostrarToast("Erro ao abrir câmera!", "erro");
                fecharCameraScanner();
            });
        }

        function fecharCameraScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('modal-camera').classList.add('hidden');
                });
            } else {
                document.getElementById('modal-camera').classList.add('hidden');
            }
        }

        // ================= UTILITÁRIOS =================
        function mostrarToast(msg, tipo = 'sucesso') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = msg;

            if (tipo === 'erro' || tipo === 'alerta') {
                toast.className = "fixed top-5 left-4 right-4 bg-zinc-900 text-white border border-rose-500 px-4 py-3 rounded-2xl shadow-2xl transform translate-y-0 opacity-100 transition-all duration-300 flex items-center gap-3 z-[2000] max-w-sm mx-auto";
                icon.className = "fa-solid fa-triangle-exclamation text-rose-500 text-base";
            } else {
                toast.className = "fixed top-5 left-4 right-4 bg-zinc-900 text-white border border-emerald-400 px-4 py-3 rounded-2xl shadow-2xl transform translate-y-0 opacity-100 transition-all duration-300 flex items-center gap-3 z-[2000] max-w-sm mx-auto";
                icon.className = "fa-solid fa-circle-check text-emerald-400 text-base";
            }

            setTimeout(() => {
                toast.className = "fixed top-5 left-4 right-4 bg-zinc-900 text-white border border-emerald-400 px-4 py-3 rounded-2xl shadow-2xl transform -translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 z-[2000] max-w-sm mx-auto";
            }, 3000);
        }

        function escapeAttr(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
